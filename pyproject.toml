[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jafat"
version = "0.1.0"
description = "Just Another Fscking Agent Tool - A Rich CLI wrapper for Cursor Agent headless mode"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["cursor", "agent", "cli", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/wwff-tech/jafat"
Repository = "https://github.com/wwff-tech/jafat"
Issues = "https://github.com/wwff-tech/jafat/issues"

[project.scripts]
jafat = "jafat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jafat"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

# ── ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/jafat"]
branch = true

[tool.coverage.report]
show_missing = true
